<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Hopper — demo</title>
<style>
  html,body{margin:0;height:100%;background:#7cc8ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Sky Hopper — original GameTapGo sample demo. Tap / click / space to jump (double jump allowed).
// ?attract=1 makes a bot play (used for trailers and feed previews).
const ATTRACT = new URLSearchParams(location.search).has("attract");
const DEMO_SECONDS = 60;
const c = document.getElementById("c"), x = c.getContext("2d");
let W, H, S;
function resize(){ const d = Math.min(devicePixelRatio||1, 2); W = c.width = innerWidth*d; H = c.height = innerHeight*d; S = H/1280; }
addEventListener("resize", resize); resize();

const GRAV = 2600, JUMP = -1150, SPEED0 = 360;
let state, hero, islands, coins, clouds, score, best = 0, t0, speed, over, msg;

function reset(){
  hero = { x: 200, y: 600, vy: 0, jumps: 0, onGround: false, squash: 0 };
  islands = []; coins = []; score = 0; speed = SPEED0; over = false; t0 = performance.now(); msg = null;
  let ix = 0;
  islands.push({ x: 0, y: 820, w: 900 });
  ix = 900;
  while (ix < 4000) ix = addIsland(ix);
  clouds = Array.from({length: 7}, (_, i) => ({ x: i*260, y: 80 + Math.random()*500, s: .6 + Math.random()*.8 }));
  state = "play";
}
function addIsland(after){
  const gap = 140 + Math.random()*170 + speed*0.12;
  const w = 260 + Math.random()*320;
  const last = islands[islands.length-1];
  const y = Math.max(560, Math.min(980, last.y + (Math.random()*300 - 150)));
  const isl = { x: after + gap, y, w };
  islands.push(isl);
  const n = 1 + (Math.random()*3|0);
  for (let i = 0; i < n; i++) coins.push({ x: isl.x + 60 + i*70, y: y - 120 - (i===1?40:0), got: false });
  return isl.x + w;
}
function jump(){
  if (state === "end") return;
  if (over){ reset(); return; }
  if (hero.jumps < 2){ hero.vy = JUMP * (hero.jumps ? .85 : 1); hero.jumps++; hero.onGround = false; hero.squash = -0.25; }
}
if (!ATTRACT){
  addEventListener("pointerdown", e => { e.preventDefault(); jump(); });
  addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); } });
}

function bot(){
  // Jump when the island under/ahead ends soon, or when a higher island is close.
  const feet = hero.x + 40;
  const cur = islands.find(i => feet >= i.x && feet <= i.x + i.w);
  const next = islands.find(i => i.x > feet);
  if (hero.onGround && cur && cur.x + cur.w - feet < speed*0.18) jump();
  else if (!hero.onGround && hero.jumps === 1 && hero.vy > 150 && next && !cur && next.y < hero.y + 140 && next.x - feet > 60) jump();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  if (state === "play" && !over){
    if (ATTRACT) bot();
    speed += dt*8;
    const dx = speed*dt;
    for (const i of islands) i.x -= dx;
    for (const k of coins) k.x -= dx;
    for (const cl of clouds){ cl.x -= dx*0.25*cl.s; if (cl.x < -300) { cl.x += 2100; cl.y = 80 + Math.random()*500; } }
    while (islands.length && islands[0].x + islands[0].w < -200) islands.shift();
    while (coins.length && coins[0].x < -100) coins.shift();
    let end = islands[islands.length-1]; if (end.x + end.w < 2600) addIsland(end.x + end.w);

    hero.vy += GRAV*dt; const prevY = hero.y; hero.y += hero.vy*dt; hero.onGround = false;
    for (const i of islands){
      if (hero.x + 50 > i.x && hero.x + 10 < i.x + i.w && prevY <= i.y && hero.y >= i.y){
        hero.y = i.y; hero.vy = 0; hero.jumps = 0; hero.onGround = true; if (hero.squash === 0) hero.squash = .2;
      }
    }
    hero.squash *= 0.85; if (Math.abs(hero.squash) < .01) hero.squash = 0;
    for (const k of coins){ if (!k.got && Math.abs(k.x - (hero.x+30)) < 55 && Math.abs(k.y - (hero.y-60)) < 70){ k.got = true; score += 10; } }
    score += dt*2;
    if (hero.y > 1400){ over = true; best = Math.max(best, score|0); if (ATTRACT) setTimeout(reset, 900); }
    if (!ATTRACT && (now - t0)/1000 > DEMO_SECONDS){ state = "end"; best = Math.max(best, score|0); parent.postMessage({ type: "gtg:demo-end", score: score|0 }, "*"); }
  }
  draw(now);
  requestAnimationFrame(frame);
}

function draw(now){
  x.setTransform(1,0,0,1,0,0);
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#3aa0ff"); g.addColorStop(.7,"#9bdcff"); g.addColorStop(1,"#d9f4ff");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  x.setTransform(S,0,0,S,0,0);
  const VW = W/S;
  // far hills
  x.fillStyle = "#8fd6a6";
  x.beginPath(); x.moveTo(0,1280);
  for (let i = 0; i <= VW+60; i += 60) x.lineTo(i, 1060 + Math.sin(i*0.01 + now*0.0001)*40);
  x.lineTo(VW,1280); x.fill();
  // clouds
  for (const cl of clouds) cloud(cl.x, cl.y, cl.s);
  // islands
  for (const i of islands) island(i);
  // coins
  for (const k of coins) if (!k.got) coin(k.x, k.y, now);
  heroDraw(now);
  if (ATTRACT) return; // trailers: no HUD, the site draws its own overlay
  // HUD
  x.fillStyle = "rgba(10,20,60,.55)"; round(24,24,300,84,24); x.fill();
  x.fillStyle = "#ffd23f"; x.beginPath(); x.arc(70,66,22,0,7); x.fill();
  x.fillStyle = "#fff"; x.font = "800 46px system-ui,sans-serif"; x.textBaseline = "middle"; x.fillText(score|0, 108, 68);
  if (!ATTRACT && state === "play"){
    const left = Math.max(0, DEMO_SECONDS - (performance.now()-t0)/1000)|0;
    x.fillStyle = "rgba(10,20,60,.55)"; round(VW-190,24,166,84,24); x.fill();
    x.fillStyle = "#fff"; x.fillText(left + "s", VW-150, 68);
  }
  if (over && !ATTRACT) banner("Oops! Tap to try again", "Best: " + best);
  if (state === "end") banner("Demo over!", "Score " + best + " — get the full game for more levels");
  if (!ATTRACT && state === "play" && (performance.now()-t0) < 2500) banner("Tap to jump", "Tap twice for a double jump");
}
function banner(a, b){
  const VW = W/S;
  x.fillStyle = "rgba(10,20,60,.75)"; round(VW/2-330, 470, 660, 230, 36); x.fill();
  x.fillStyle = "#fff"; x.textAlign = "center"; x.font = "900 60px system-ui,sans-serif"; x.fillText(a, VW/2, 550);
  x.font = "600 32px system-ui,sans-serif"; x.fillStyle = "#cfe6ff"; x.fillText(b, VW/2, 630); x.textAlign = "left";
}
function round(a,b,w,h,r){ x.beginPath(); x.roundRect(a,b,w,h,r); }
function cloud(cx, cy, s){
  x.fillStyle = "rgba(255,255,255,.9)";
  x.beginPath(); x.ellipse(cx, cy, 90*s, 40*s, 0, 0, 7); x.ellipse(cx-60*s, cy+10*s, 55*s, 32*s, 0, 0, 7); x.ellipse(cx+60*s, cy+12*s, 60*s, 30*s, 0, 0, 7); x.fill();
}
function island(i){
  // rocky underside: a jagged, tapering silhouette
  x.fillStyle = "#8a5a3c";
  x.beginPath(); x.moveTo(i.x, i.y+20);
  const steps = Math.max(3, i.w/50|0);
  for (let s = 0; s <= steps; s++){
    const px = i.x + i.w*s/steps, edge = Math.sin(Math.PI*s/steps);
    x.lineTo(px, i.y + 40 + edge*(110 + (s%2)*30));
  }
  x.lineTo(i.x+i.w, i.y+20); x.closePath(); x.fill();
  x.fillStyle = "#6e4630";
  x.beginPath(); x.moveTo(i.x+i.w*.3, i.y+50); x.lineTo(i.x+i.w*.5, i.y+130); x.lineTo(i.x+i.w*.62, i.y+60); x.fill();
  // grass cap with rounded bumps
  x.fillStyle = "#4cc34a"; round(i.x-10, i.y-6, i.w+20, 44, 22); x.fill();
  x.fillStyle = "#7be05f";
  for (let b = i.x+10; b < i.x+i.w-10; b += 46){ x.beginPath(); x.arc(b, i.y, 16, Math.PI, 0); x.fill(); }
}
function coin(cx, cy, now){
  const w = Math.abs(Math.sin(now*0.006 + cx*0.01))*22 + 4;
  x.fillStyle = "#f6b40e"; x.beginPath(); x.ellipse(cx, cy, w, 26, 0, 0, 7); x.fill();
  x.fillStyle = "#ffe066"; x.beginPath(); x.ellipse(cx, cy, w*.6, 17, 0, 0, 7); x.fill();
}
function heroDraw(now){
  const hx = hero.x, hy = hero.y, sq = hero.squash;
  x.save(); x.translate(hx+30, hy); x.scale(1 + sq*.5, 1 - sq);
  // body (blue hoodie)
  x.fillStyle = "#2e5bff"; x.beginPath(); x.ellipse(0, -55, 34, 40, 0, 0, 7); x.fill();
  // legs
  const run = hero.onGround ? Math.sin(now*0.025)*10 : 6;
  x.fillStyle = "#1d2b6b"; x.fillRect(-20, -22, 14, 22 + run*.4); x.fillRect(6, -22, 14, 22 - run*.4);
  x.fillStyle = "#ff7a2f"; x.beginPath(); x.ellipse(-13, 2 + run*.4, 14, 8, 0, 0, 7); x.ellipse(13, 2 - run*.4, 14, 8, 0, 0, 7); x.fill();
  // head
  x.fillStyle = "#ffd2a8"; x.beginPath(); x.arc(0, -115, 34, 0, 7); x.fill();
  // hair tuft
  x.fillStyle = "#8a4a1f"; x.beginPath(); x.moveTo(-34,-120); x.quadraticCurveTo(-30,-160,0,-152); x.quadraticCurveTo(30,-165,38,-125); x.quadraticCurveTo(10,-140,-34,-120); x.fill();
  // goggles
  x.fillStyle = "#29c4ff"; x.beginPath(); x.ellipse(-12,-128,11,8,0,0,7); x.ellipse(14,-128,11,8,0,0,7); x.fill();
  // eyes + smile
  x.fillStyle = "#1a1a2e"; x.beginPath(); x.arc(-10,-108,5,0,7); x.arc(14,-108,5,0,7); x.fill();
  x.strokeStyle = "#1a1a2e"; x.lineWidth = 3; x.beginPath(); x.arc(2,-98,9,.2,Math.PI-.2); x.stroke();
  x.restore();
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
