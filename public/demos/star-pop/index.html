<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Star Pop — demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1446;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Star Pop — original GameTapGo sample demo. Tap the rising stars before they float away.
const ATTRACT = new URLSearchParams(location.search).has("attract");
const DEMO_SECONDS = 60;
const c = document.getElementById("c"), x = c.getContext("2d");
let W, H, S;
function resize(){ const d = Math.min(devicePixelRatio||1, 2); W = c.width = innerWidth*d; H = c.height = innerHeight*d; S = H/1280; }
addEventListener("resize", resize); resize();
const VW = () => W/S;
const COLORS = ["#ffd23f","#ff6fb5","#5cf2c4","#7aa8ff","#ffa24c"];
let stars, pops, score, missed, t0, state, spawnT, best = 0, bg;
function reset(){
  stars = []; pops = []; score = 0; missed = 0; t0 = performance.now(); state = "play"; spawnT = 0;
  bg = Array.from({length: 80}, () => ({ x: Math.random()*1200, y: Math.random()*1280, r: Math.random()*2+1 }));
}
function popAt(px, py){
  if (state === "end") return;
  if (state === "over"){ reset(); return; }
  for (let i = stars.length-1; i >= 0; i--){
    const s = stars[i];
    if (Math.hypot(s.x - px, s.y - py) < s.r + 20){
      stars.splice(i, 1); score += s.r < 50 ? 15 : 10;
      for (let k = 0; k < 10; k++) pops.push({ x: s.x, y: s.y, vx: Math.cos(k)*300*Math.random(), vy: Math.sin(k)*300*Math.random(), life: .6, col: s.col });
      return;
    }
  }
}
if (!ATTRACT){
  addEventListener("pointerdown", e => { e.preventDefault(); const d = Math.min(devicePixelRatio||1, 2); popAt(e.clientX*d/S, e.clientY*d/S); });
}
let botT = 0;
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  if (state === "play"){
    const el = (now - t0)/1000;
    spawnT -= dt;
    if (spawnT <= 0){
      spawnT = Math.max(0.35, 0.9 - el*0.01);
      const r = 40 + Math.random()*30;
      stars.push({ x: r + Math.random()*(VW() - 2*r), y: 1340, r, vy: 160 + Math.random()*120 + el*3, wob: Math.random()*6, col: COLORS[Math.random()*COLORS.length|0] });
    }
    for (const s of stars){ s.y -= s.vy*dt; s.x += Math.sin(now*0.002 + s.wob)*0.6; }
    for (let i = stars.length-1; i >= 0; i--) if (stars[i].y < -80){ stars.splice(i,1); missed++; }
    if (ATTRACT){ botT -= dt; const ripe = stars.filter(s => s.y < 520); if (botT <= 0 && ripe.length){ botT = 0.3; const tgt = ripe.reduce((a,b) => a.y < b.y ? a : b); popAt(tgt.x, tgt.y); } }
    if (missed >= 8){ state = "over"; best = Math.max(best, score); if (ATTRACT) setTimeout(reset, 900); }
    if (!ATTRACT && el > DEMO_SECONDS){ state = "end"; best = Math.max(best, score); parent.postMessage({ type: "gtg:demo-end", score }, "*"); }
  }
  for (const p of pops){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  draw(now); requestAnimationFrame(frame);
}
function draw(now){
  x.setTransform(1,0,0,1,0,0);
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#120c38"); g.addColorStop(1,"#3a1d78"); x.fillStyle = g; x.fillRect(0,0,W,H);
  x.setTransform(S,0,0,S,0,0);
  for (const b of bg){ x.fillStyle = `rgba(255,255,255,${.3 + .3*Math.sin(now*0.002 + b.x)})`; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); }
  for (const s of stars) drawStar(s.x, s.y, s.r, s.col, now);
  for (const p of pops){ x.globalAlpha = p.life/.6; x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y, 8, 0, 7); x.fill(); }
  x.globalAlpha = 1;
  if (ATTRACT) return; // trailers: no HUD, the site draws its own overlay
  x.fillStyle = "rgba(255,255,255,.12)"; x.beginPath(); x.roundRect(24,24,300,84,24); x.fill();
  x.fillStyle = "#fff"; x.font = "800 46px system-ui,sans-serif"; x.textBaseline = "middle"; x.fillText("★ " + score, 48, 68);
  x.font = "700 28px system-ui,sans-serif"; x.fillStyle = "#ffb3d6"; x.fillText("Missed " + missed + "/8", 48, 130);
  if (!ATTRACT && state === "play"){
    const left = Math.max(0, DEMO_SECONDS - (performance.now()-t0)/1000)|0;
    x.fillStyle = "rgba(255,255,255,.12)"; x.beginPath(); x.roundRect(VW()-190,24,166,84,24); x.fill();
    x.fillStyle = "#fff"; x.font = "800 46px system-ui,sans-serif"; x.fillText(left + "s", VW()-150, 68);
  }
  if (state === "over" && !ATTRACT) banner("Out of stars! Tap to play again", "Best: " + best);
  if (state === "end") banner("Demo over!", "Score " + best + " — get the full game for more worlds");
  if (!ATTRACT && state === "play" && (performance.now()-t0) < 2500) banner("Tap the stars!", "Don't let 8 float away");
}
function banner(a, b){
  const vw = VW();
  x.fillStyle = "rgba(10,10,40,.85)"; x.beginPath(); x.roundRect(vw/2-340, 470, 680, 230, 36); x.fill();
  x.fillStyle = "#fff"; x.textAlign = "center"; x.font = "900 50px system-ui,sans-serif"; x.fillText(a, vw/2, 550);
  x.font = "600 30px system-ui,sans-serif"; x.fillStyle = "#e3d6ff"; x.fillText(b, vw/2, 630); x.textAlign = "left";
}
function drawStar(cx, cy, r, col, now){
  x.save(); x.translate(cx, cy); x.rotate(Math.sin(now*0.003 + cx)*.25);
  x.fillStyle = col; x.beginPath();
  for (let i = 0; i < 10; i++){ const rr = i%2 ? r*.48 : r, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  x.closePath(); x.fill();
  x.fillStyle = "#1a1446"; x.beginPath(); x.arc(-r*.2, -r*.05, r*.09, 0, 7); x.arc(r*.2, -r*.05, r*.09, 0, 7); x.fill();
  x.strokeStyle = "#1a1446"; x.lineWidth = 3; x.beginPath(); x.arc(0, r*.12, r*.14, .2, Math.PI-.2); x.stroke();
  x.restore();
}
reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
