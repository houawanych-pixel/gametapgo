<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Turbo Kart Rush — demo</title>
<style>
  html,body{margin:0;height:100%;background:#2b2f3a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Turbo Kart Rush — original GameTapGo sample demo.
// Tap the left or right half (or arrow keys) to switch lanes. Dodge cones, grab stars.
const ATTRACT = new URLSearchParams(location.search).has("attract");
const DEMO_SECONDS = 60, LANES = 3;
const c = document.getElementById("c"), x = c.getContext("2d");
let W, H, S;
function resize(){ const d = Math.min(devicePixelRatio||1, 2); W = c.width = innerWidth*d; H = c.height = innerHeight*d; S = H/1280; }
addEventListener("resize", resize); resize();

let lane, laneX, things, score, speed, over, t0, state, roadOff, best = 0, spawnT;
function VW(){ return W/S; }
function laneCenter(l){ const rw = Math.min(VW()*0.9, 640), left = VW()/2 - rw/2; return left + rw*(l+.5)/LANES; }
function reset(){ lane = 1; laneX = laneCenter(1); things = []; score = 0; speed = 520; over = false; t0 = performance.now(); state = "play"; roadOff = 0; spawnT = 0; }
function move(d){
  if (state === "end") return;
  if (over){ reset(); return; }
  lane = Math.max(0, Math.min(LANES-1, lane + d));
}
if (!ATTRACT){
  addEventListener("pointerdown", e => { e.preventDefault(); move(e.clientX < innerWidth/2 ? -1 : 1); });
  addEventListener("keydown", e => { if (e.code === "ArrowLeft") move(-1); if (e.code === "ArrowRight") move(1); });
}
function bot(){
  const danger = l => things.some(t => t.kind === "cone" && t.lane === l && t.y > 650 && t.y < 1080);
  const star = l => things.some(t => t.kind === "star" && t.lane === l && t.y > 500 && t.y < 1000);
  if (danger(lane)){
    const opts = [lane-1, lane+1].filter(l => l >= 0 && l < LANES && !danger(l));
    if (opts.length) move(opts[0] - lane);
  } else {
    for (const l of [lane-1, lane+1]) if (l >= 0 && l < LANES && star(l) && !danger(l)) { move(l - lane); break; }
  }
}
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  if (state === "play" && !over){
    if (ATTRACT) bot();
    speed += dt*10; roadOff = (roadOff + speed*dt) % 160;
    laneX += (laneCenter(lane) - laneX) * Math.min(1, dt*14);
    spawnT -= dt;
    if (spawnT <= 0){
      spawnT = 0.55 + Math.random()*0.35;
      const free = [0,1,2].sort(() => Math.random()-.5);
      things.push({ kind: "cone", lane: free[0], y: -80 });
      if (Math.random() < .35) things.push({ kind: "cone", lane: free[1], y: -80 });
      if (Math.random() < .55) things.push({ kind: "star", lane: free[2], y: -220 });
    }
    for (const t of things) t.y += speed*dt;
    things = things.filter(t => t.y < 1400 && !t.got);
    const carY = 1060;
    for (const t of things){
      if (Math.abs(laneCenter(t.lane) - laneX) < 70 && Math.abs(t.y - carY) < 80){
        if (t.kind === "star"){ t.got = true; score += 25; }
        else { over = true; best = Math.max(best, score|0); if (ATTRACT) setTimeout(reset, 900); }
      }
    }
    score += dt*5;
    if (!ATTRACT && (now - t0)/1000 > DEMO_SECONDS){ state = "end"; best = Math.max(best, score|0); parent.postMessage({ type: "gtg:demo-end", score: score|0 }, "*"); }
  }
  draw(now); requestAnimationFrame(frame);
}
function draw(now){
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle = "#58c96b"; x.fillRect(0,0,W,H);
  x.setTransform(S,0,0,S,0,0);
  const vw = VW(), rw = Math.min(vw*0.9, 640), left = vw/2 - rw/2;
  // trees along the verge
  for (let i = -1; i < 10; i++){
    const y = i*160 + roadOff;
    tree(left - 50, y); tree(left + rw + 50, y + 80);
  }
  // road with curbs
  x.fillStyle = "#3b3f4c"; x.fillRect(left, 0, rw, 1280);
  for (let i = -1; i < 18; i++){
    x.fillStyle = i%2 ? "#ff4d4d" : "#fff";
    x.fillRect(left-18, i*80 + roadOff%160, 18, 80); x.fillRect(left+rw, i*80 + roadOff%160, 18, 80);
  }
  x.fillStyle = "rgba(255,255,255,.7)";
  for (let l = 1; l < LANES; l++) for (let i = -1; i < 10; i++) x.fillRect(left + rw*l/LANES - 5, i*160 + roadOff, 10, 80);
  for (const t of things) t.kind === "cone" ? cone(laneCenter(t.lane), t.y) : star(laneCenter(t.lane), t.y, now);
  kart(laneX, 1060, now);
  if (ATTRACT) return; // trailers: no HUD, the site draws its own overlay
  x.fillStyle = "rgba(10,20,60,.6)"; x.beginPath(); x.roundRect(24,24,300,84,24); x.fill();
  x.fillStyle = "#ffd23f"; star(70, 66, now, .55);
  x.fillStyle = "#fff"; x.font = "800 46px system-ui,sans-serif"; x.textBaseline = "middle"; x.fillText(score|0, 108, 68);
  if (!ATTRACT && state === "play"){
    const leftS = Math.max(0, DEMO_SECONDS - (performance.now()-t0)/1000)|0;
    x.fillStyle = "rgba(10,20,60,.6)"; x.beginPath(); x.roundRect(vw-190,24,166,84,24); x.fill();
    x.fillStyle = "#fff"; x.fillText(leftS + "s", vw-150, 68);
  }
  if (over && !ATTRACT) banner("Crash! Tap to race again", "Best: " + best);
  if (state === "end") banner("Demo over!", "Score " + best + " — get the full game for more tracks");
  if (!ATTRACT && state === "play" && (performance.now()-t0) < 2500) banner("Tap left or right", "Dodge cones, grab stars");
}
function banner(a, b){
  const vw = VW();
  x.fillStyle = "rgba(10,20,60,.8)"; x.beginPath(); x.roundRect(vw/2-330, 470, 660, 230, 36); x.fill();
  x.fillStyle = "#fff"; x.textAlign = "center"; x.font = "900 56px system-ui,sans-serif"; x.fillText(a, vw/2, 550);
  x.font = "600 30px system-ui,sans-serif"; x.fillStyle = "#cfe6ff"; x.fillText(b, vw/2, 630); x.textAlign = "left";
}
function tree(tx, ty){
  x.fillStyle = "#2f8f45"; x.beginPath(); x.moveTo(tx, ty-60); x.lineTo(tx+38, ty+20); x.lineTo(tx-38, ty+20); x.fill();
  x.fillStyle = "#3fae58"; x.beginPath(); x.moveTo(tx, ty-90); x.lineTo(tx+28, ty-20); x.lineTo(tx-28, ty-20); x.fill();
}
function cone(cx, cy){
  x.fillStyle = "#ff7a1a"; x.beginPath(); x.moveTo(cx, cy-60); x.lineTo(cx+36, cy+30); x.lineTo(cx-36, cy+30); x.fill();
  x.fillStyle = "#fff"; x.beginPath(); x.moveTo(cx-18, cy-12); x.lineTo(cx+18, cy-12); x.lineTo(cx+24, cy+4); x.lineTo(cx-24, cy+4); x.fill();
  x.fillStyle = "#c95a10"; x.beginPath(); x.roundRect(cx-46, cy+26, 92, 14, 6); x.fill();
}
function star(cx, cy, now, s = 1){
  x.save(); x.translate(cx, cy); x.rotate(Math.sin(now*0.004)*.2); x.scale(s, s);
  x.fillStyle = "#ffd23f"; x.beginPath();
  for (let i = 0; i < 10; i++){ const r = i%2 ? 18 : 40, a = -Math.PI/2 + i*Math.PI/5; x.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  x.fill(); x.restore();
}
function kart(kx, ky, now){
  x.save(); x.translate(kx, ky);
  x.fillStyle = "#1a1a24"; for (const [a,b] of [[-44,-36],[44,-36],[-46,40],[46,40]]){ x.beginPath(); x.roundRect(a-12,b-18,24,36,8); x.fill(); }
  x.fillStyle = "#e8323c"; x.beginPath(); x.moveTo(-34,-70); x.quadraticCurveTo(0,-95,34,-70); x.lineTo(42,50); x.quadraticCurveTo(0,66,-42,50); x.closePath(); x.fill();
  x.fillStyle = "#ffd23f"; x.fillRect(-30, 30, 60, 10);
  // driver helmet
  x.fillStyle = "#2e5bff"; x.beginPath(); x.arc(0, -10, 24, 0, 7); x.fill();
  x.fillStyle = "#9fe6ff"; x.beginPath(); x.ellipse(0, -18, 15, 8, 0, 0, 7); x.fill();
  x.restore();
}
reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
